name: Sync Patty Reel covers

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/sync_reel_covers.py"
      - ".github/workflows/sync-reel-covers.yml"
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patty-reel-posters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimization dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Retrieve and optimize public Reel covers
        run: python scripts/sync_reel_covers.py
      - name: Publish updated local covers
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- imagens/reels)" ]]; then
            echo "No cover changes were detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/reels
          git commit -m "chore(patty): refresh locally hosted Reel thumbnails"
          git push
