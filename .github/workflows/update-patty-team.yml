name: Atualizar equipe Patty

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-patty-team.yml"

permissions:
  contents: write

jobs:
  update-team:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Baixar novas fotos da equipe
        env:
          TEAM_ZIP_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8da8-820e-9641-d3a7ba3d2d75/raw?se=2026-10-07T14%3A09%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=1b164c2a-b688-53d1-b6e7-5b40f231bc0a&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T12%3A14%3A43Z&ske=2026-10-08T12%3A14%3A43Z&sks=b&skv=2026-02-06&sig=NReMAE/cjm156OVRAbZQutSeJFr/0S3k%2BhoWD4XvV1c%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$TEAM_ZIP_URL" -o /tmp/patty-team.zip
          unzip -o /tmp/patty-team.zip -d imagens
          ls -lh imagens/*-*.webp

      - name: Atualizar equipe e fotos dos serviços
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          start_marker = '        <section id="equipe" class="team-section">'
          end_marker = '        <section id="avaliacoes" class="reviews-section">'
          start = html.index(start_marker)
          end = html.index(end_marker, start)

          team = '''        <section id="equipe" class="team-section">
              <div class="container">
                  <h2 class="section-title fade-in">Nossas Artistas da Beleza</h2>
                  <div class="team-carousel-wrapper fade-in">
                      <div class="team-carousel">

                          <div class="team-card">
                              <img src="imagens/Patricia Teixeira.jpeg" onerror="this.src='https://placehold.co/400x600/801A39/FFF?text=Patricia'" alt="Patrícia Teixeira, cabeleireira e fundadora do Patty Centro de Beleza" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Patrícia Teixeira</h3>
                                  <p>Cabeleireira & Fundadora</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20um%20hor%C3%A1rio%20com%20a%20Patr%C3%ADcia." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Agendar com Patrícia</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/maira-ramos.webp" alt="Maira Ramos, cabeleireira especialista em escova modelada" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Maira Ramos</h3>
                                  <p>Cabeleireira<br>Especialista em escova modelada</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20um%20hor%C3%A1rio%20com%20a%20Maira%20Ramos." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Agendar com Maira</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/vaneza-regina.webp" alt="Vaneza Regina, cabeleireira especialista em alisamento e luzes" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Vaneza Regina</h3>
                                  <p>Cabeleireira<br>Especialista em alisamento e luzes</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20um%20hor%C3%A1rio%20com%20a%20Vaneza%20Regina." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Agendar com Vaneza</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/michele-tavares.webp" alt="Michele Tavares, lash designer e esteticista" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Michele Tavares</h3>
                                  <p>Lash Designer & Esteticista</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20um%20hor%C3%A1rio%20com%20a%20Michele%20Tavares." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Agendar com Michele</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/deime-sotolongo.webp" alt="Deime Sotolongo, manicure, especialista em reflexologia nos pés e nail designer" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Deime Sotolongo</h3>
                                  <p>Manicure completa<br>Reflexologia nos pés & Nail Designer</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20um%20hor%C3%A1rio%20com%20a%20Deime%20Sotolongo." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Agendar com Deime</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/allegra-marques.webp" alt="Allegra Marques, especialista em cachos e transformações de alto impacto" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Allegra Marques</h3>
                                  <p>Especialista em cachos<br>Transformações de alto impacto</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20um%20hor%C3%A1rio%20com%20a%20Allegra%20Marques." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Agendar com Allegra</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/hellen-guesser.webp" alt="Héllen Guesser, maquiadora" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Héllen Guesser</h3>
                                  <p>Maquiadora</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20um%20hor%C3%A1rio%20com%20a%20H%C3%A9llen%20Guesser." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Agendar com Héllen</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/ana-clara-teixeira.webp" alt="Ana Clara Teixeira, recepcionista e gerente" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Ana Clara Teixeira</h3>
                                  <p>Recepcionista & Gerente</p>
                                  <a href="https://wa.me/5548988032478?text=Ol%C3%A1%2C%20gostaria%20de%20falar%20com%20a%20Ana%20Clara%20Teixeira." target="_blank" rel="noopener noreferrer" class="btn-whatsapp-small">Falar com Ana Clara</a>
                              </div>
                          </div>

                          <div class="team-card">
                              <img src="imagens/ingrid-goedert.webp" alt="Ingrid Goedert, social media do Patty Centro de Beleza" loading="lazy" decoding="async">
                              <div class="team-card-overlay">
                                  <h3>Ingrid Goedert</h3>
                                  <p>Social Media</p>
                              </div>
                          </div>

                      </div>
                  </div>
              </div>
          </section>

'''

          html = html[:start] + team + html[end:]

          # Atualiza imagens de cards de serviço para refletir a equipe atual.
          replacements = {
              'imagens/servico-cabelos.jpg': 'imagens/allegra-marques.webp',
              'imagens/Ana Paula nail design.jpeg': 'imagens/deime-sotolongo.webp',
              'imagens/Michele.jpeg': 'imagens/michele-tavares.webp',
              'imagens/Paula Severo Esteticista.jpeg': 'imagens/michele-tavares.webp',
              'imagens/Mariana rita Maquiadora.jpeg': 'imagens/hellen-guesser.webp',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)

          path.write_text(html, encoding="utf-8")
          PY

      - name: Validar atualização
        run: |
          set -euo pipefail
          for name in "Maira Ramos" "Vaneza Regina" "Michele Tavares" "Deime Sotolongo" "Allegra Marques" "Héllen Guesser" "Ana Clara Teixeira" "Ingrid Goedert"; do
            grep -q "$name" index.html
          done
          for img in maira-ramos vaneza-regina michele-tavares deime-sotolongo allegra-marques hellen-guesser ana-clara-teixeira ingrid-goedert; do
            test -s "imagens/$img.webp"
          done

      - name: Commitar atualização e remover workflow temporário
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-patty-team.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: atualiza equipe e fotos do Patty Centro de Beleza"
          git push origin main
