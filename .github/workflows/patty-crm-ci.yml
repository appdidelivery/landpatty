name: Patty CRM - syntax checks
on:
  push:
    branches:
      - feature/patty-crm-upstream-20261019
      - feature/patty-crm-sem-cloudflare-20261020
  pull_request:
    paths:
      - "api/**"
      - "lib/**"
      - "crm.html"
      - "index.html"
      - "scripts/check-crm-syntax.mjs"
      - "package.json"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-crm-syntax.mjs
